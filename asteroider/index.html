<!DOCTYPE html>
<html lang="sv">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Asteroider ☄️</title>
<style>
  * { box-sizing: border-box; }
  html, body {
    height: 100%;
    margin: 0;
    overflow: hidden;
  }
  body {
    font-family: 'Trebuchet MS', 'Comic Sans MS', sans-serif;
    background: linear-gradient(135deg, #6C5CE7, #00CEC9);
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 8px;
  }
  h1 {
    color: #2d3436;
    margin: 0;
    font-size: clamp(14px, 2.4vh, 22px);
    white-space: nowrap;
  }
  #app {
    background: white;
    border-radius: 16px;
    padding: 8px;
    box-shadow: 0 10px 30px rgba(0,0,0,0.3);
    display: grid;
    grid-template-rows: auto 1fr auto;
    gap: 8px;
    width: 100%;
    height: 100%;
    max-width: 1100px;
  }
  .topbar, .bottombar {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 10px;
    flex-wrap: wrap;
    background: #f1f2f6;
    border-radius: 12px;
    padding: 8px 12px;
  }
  .diff-group {
    display: flex;
    gap: 4px;
    background: white;
    border-radius: 10px;
    padding: 3px;
  }
  button.diff {
    border: none;
    background: transparent;
    border-radius: 8px;
    padding: 6px 10px;
    font-weight: bold;
    font-size: clamp(11px, 1.6vh, 14px);
    cursor: pointer;
    color: #636e72;
  }
  button.diff.active { background: #6C5CE7; color: white; }
  .stats {
    font-weight: bold;
    color: #2d3436;
    font-size: clamp(12px, 1.8vh, 15px);
    white-space: nowrap;
  }
  button.action {
    border: none;
    border-radius: 8px;
    padding: 8px 14px;
    font-weight: bold;
    cursor: pointer;
    color: #2d3436;
    font-size: clamp(11px, 1.6vh, 14px);
    white-space: nowrap;
    background: #fdcb6e;
  }
  .board-wrap {
    flex: 1;
    min-height: 0;
    min-width: 0;
    display: flex;
    overflow: hidden;
  }
  canvas {
    background: #0b1026;
    border: 3px solid #2d3436;
    border-radius: 10px;
    display: block;
    width: 100%;
    height: 100%;
    touch-action: none;
  }
  .ctrlpad {
    display: flex;
    align-items: center;
    gap: 8px;
  }
  .cbtn {
    border: none;
    background: #dfe4ea;
    border-radius: 12px;
    width: clamp(48px, 12vw, 76px);
    height: clamp(48px, 12vw, 76px);
    font-size: clamp(22px, 5vw, 32px);
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    touch-action: none;
    user-select: none;
  }
  .cbtn:active { background: #6C5CE7; color: white; }
  .cbtn.fire {
    background: #ff7675;
    color: white;
    margin-left: 10px;
  }
  .cbtn.fire:active { background: #d63031; }
  #overOverlay {
    position: fixed;
    inset: 0;
    background: rgba(45,52,54,0.55);
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 20px;
  }
  #overOverlay.hidden { display: none; }
  .over-card {
    background: white;
    border-radius: 20px;
    padding: 32px 28px;
    text-align: center;
    box-shadow: 0 10px 30px rgba(0,0,0,0.4);
    max-width: 360px;
  }
  .over-card .emoji { font-size: 3rem; margin-bottom: 8px; }
  .over-card p { color: #2d3436; font-size: 1.1rem; margin: 8px 0 20px; }
  .over-card button {
    background: #00b894;
    color: white;
    font-size: 1rem;
    padding: 10px 20px;
  }
</style>
</head>
<body>

<div id="app">
  <div class="topbar">
    <h1>☄️ Asteroider</h1>
    <div class="diff-group">
      <button class="diff" data-diff="easy">Lätt</button>
      <button class="diff active" data-diff="medium">Mellan</button>
      <button class="diff" data-diff="hard">Svår</button>
    </div>
    <div class="stats">Poäng: <span id="score">0</span></div>
    <div class="stats">Liv: <span id="lives">3</span></div>
    <button id="restartBtn" class="action">🔄 Ny omgång</button>
  </div>

  <div class="board-wrap">
    <canvas id="canvas"></canvas>
  </div>

  <div class="bottombar">
    <div class="ctrlpad">
      <button class="cbtn" id="rotLeftBtn" aria-label="Rotera vänster">⟲</button>
      <button class="cbtn" id="thrustBtn" aria-label="Gasa">⬆️</button>
      <button class="cbtn" id="rotRightBtn" aria-label="Rotera höger">⟳</button>
      <button class="cbtn fire" id="fireBtn" aria-label="Skjut">🔴</button>
    </div>
  </div>
</div>

<div id="overOverlay" class="hidden">
  <div class="over-card">
    <div class="emoji" id="overEmoji">☄️</div>
    <div><strong id="overTitle">Game over!</strong></div>
    <p>Du fick <span id="overScore"></span> poäng</p>
    <button id="playAgainBtn" class="action">Spela igen</button>
  </div>
</div>

<script>
const canvas = document.getElementById('canvas');
const ctx = canvas.getContext('2d');
const scoreEl = document.getElementById('score');
const livesEl = document.getElementById('lives');
const overOverlay = document.getElementById('overOverlay');
const overScoreEl = document.getElementById('overScore');
const overTitleEl = document.getElementById('overTitle');
const overEmojiEl = document.getElementById('overEmoji');

const SETTINGS = {
  easy:   { count: 4, speed: 40 },
  medium: { count: 6, speed: 65 },
  hard:   { count: 9, speed: 100 },
};
const SPLIT_TABLE = {
  large:  { next: 'medium', score: 20 },
  medium: { next: 'small',  score: 50 },
  small:  { next: null,     score: 100 },
};
const ROTATE_SPEED = 3.4;
const DRAG = 0.6;
const BULLET_LIFETIME = 1.3;
const FIRE_COOLDOWN = 300;
const INVULN_TIME = 1800;

let difficulty = 'medium';
let W = 0, H = 0;
let speedScale = 1;
let shipR = 16;
let shipMaxSpeed = 260, shipThrustAccel = 300, bulletSpeed = 480;
const RADII = { large: 40, medium: 24, small: 14 };

let ship = { x: 0, y: 0, vx: 0, vy: 0, angle: 0 };
let bullets = [];
let asteroids = [];
let stars = [];
let score = 0, lives = 3;
let fireCooldown = 0;
let invulnUntil = 0;
let running = false;
let rafId = null;
let lastTime = 0;

const keys = { left: false, right: false, thrust: false, fire: false };
const touch = { left: false, right: false, thrust: false, fire: false };

function rotatingLeft() { return keys.left || touch.left; }
function rotatingRight() { return keys.right || touch.right; }
function thrusting() { return keys.thrust || touch.thrust; }
function firingActive() { return keys.fire || touch.fire; }

function computeLayout() {
  const wrap = canvas.parentElement;
  W = Math.max(1, Math.round(wrap.clientWidth));
  H = Math.max(1, Math.round(wrap.clientHeight));
  canvas.width = W;
  canvas.height = H;

  const m = Math.min(W, H);
  RADII.large = Math.max(28, m * 0.10);
  RADII.medium = RADII.large * 0.6;
  RADII.small = RADII.large * 0.36;
  shipR = Math.max(12, m * 0.032);

  speedScale = W / 800;
  shipMaxSpeed = 260 * speedScale;
  shipThrustAccel = 320 * speedScale;
  bulletSpeed = 480 * speedScale;

  stars = [];
  for (let i = 0; i < 70; i++) {
    stars.push({ x: Math.random() * W, y: Math.random() * H, r: Math.random() * 1.4 + 0.4 });
  }
}

function createAsteroid(size, x, y, vx, vy) {
  const n = 10;
  const verts = [];
  for (let i = 0; i < n; i++) verts.push(0.75 + Math.random() * 0.4);
  return {
    x, y, vx, vy,
    r: RADII[size],
    size,
    verts,
    rot: Math.random() * Math.PI * 2,
    rotSpeed: (Math.random() - 0.5) * 1.2,
    dead: false,
  };
}

function spawnInitialAsteroids() {
  asteroids = [];
  const { count, speed } = SETTINGS[difficulty];
  let attempts = 0;
  while (asteroids.length < count && attempts < count * 40) {
    attempts++;
    const x = Math.random() * W;
    const y = Math.random() * H;
    if (Math.hypot(x - W / 2, y - H / 2) < Math.min(W, H) * 0.28) continue;
    const angle = Math.random() * Math.PI * 2;
    const sp = speed * speedScale * (0.7 + Math.random() * 0.6);
    asteroids.push(createAsteroid('large', x, y, Math.cos(angle) * sp, Math.sin(angle) * sp));
  }
}

function resetGame() {
  computeLayout();
  score = 0;
  lives = 3;
  scoreEl.textContent = '0';
  livesEl.textContent = '3';
  overOverlay.classList.add('hidden');
  ship = { x: W / 2, y: H / 2, vx: 0, vy: 0, angle: 0 };
  invulnUntil = 0;
  fireCooldown = 0;
  bullets = [];
  spawnInitialAsteroids();
  running = true;
  lastTime = performance.now();
  cancelAnimationFrame(rafId);
  rafId = requestAnimationFrame(loop);
}

function wrapObj(obj, r) {
  if (obj.x < -r) obj.x = W + r;
  else if (obj.x > W + r) obj.x = -r;
  if (obj.y < -r) obj.y = H + r;
  else if (obj.y > H + r) obj.y = -r;
}

function splitAsteroid(a) {
  a.dead = true;
  const rule = SPLIT_TABLE[a.size];
  score += rule.score;
  scoreEl.textContent = String(score);
  if (rule.next) {
    const { speed } = SETTINGS[difficulty];
    for (let i = 0; i < 2; i++) {
      const angle = Math.random() * Math.PI * 2;
      const sp = speed * speedScale * (1.1 + Math.random() * 0.6);
      asteroids.push(createAsteroid(rule.next, a.x, a.y, Math.cos(angle) * sp, Math.sin(angle) * sp));
    }
  }
}

function handleShipHit(now) {
  lives--;
  livesEl.textContent = String(lives);
  if (lives <= 0) {
    endGame(false);
    return;
  }
  ship.x = W / 2;
  ship.y = H / 2;
  ship.vx = 0;
  ship.vy = 0;
  ship.angle = 0;
  invulnUntil = now + INVULN_TIME;
}

function update(dt, now) {
  if (rotatingLeft()) ship.angle -= ROTATE_SPEED * dt;
  if (rotatingRight()) ship.angle += ROTATE_SPEED * dt;
  if (thrusting()) {
    ship.vx += Math.sin(ship.angle) * shipThrustAccel * dt;
    ship.vy += -Math.cos(ship.angle) * shipThrustAccel * dt;
  }
  ship.vx *= Math.max(0, 1 - DRAG * dt);
  ship.vy *= Math.max(0, 1 - DRAG * dt);
  const spd = Math.hypot(ship.vx, ship.vy);
  if (spd > shipMaxSpeed) {
    ship.vx = (ship.vx / spd) * shipMaxSpeed;
    ship.vy = (ship.vy / spd) * shipMaxSpeed;
  }
  ship.x += ship.vx * dt;
  ship.y += ship.vy * dt;
  wrapObj(ship, shipR);

  fireCooldown -= dt * 1000;
  if (firingActive() && fireCooldown <= 0) {
    bullets.push({
      x: ship.x + Math.sin(ship.angle) * shipR,
      y: ship.y - Math.cos(ship.angle) * shipR,
      vx: Math.sin(ship.angle) * bulletSpeed,
      vy: -Math.cos(ship.angle) * bulletSpeed,
      life: 0,
    });
    fireCooldown = FIRE_COOLDOWN;
  }

  bullets.forEach(b => {
    b.x += b.vx * dt;
    b.y += b.vy * dt;
    b.life += dt;
    wrapObj(b, 3);
  });
  bullets = bullets.filter(b => b.life < BULLET_LIFETIME);

  asteroids.forEach(a => {
    a.x += a.vx * dt;
    a.y += a.vy * dt;
    a.rot += a.rotSpeed * dt;
    wrapObj(a, a.r);
  });

  for (const b of bullets) {
    if (b.dead) continue;
    for (const a of asteroids) {
      if (a.dead) continue;
      const dx = b.x - a.x, dy = b.y - a.y;
      if (dx * dx + dy * dy < a.r * a.r) {
        b.dead = true;
        splitAsteroid(a);
        break;
      }
    }
  }
  bullets = bullets.filter(b => !b.dead);
  asteroids = asteroids.filter(a => !a.dead);

  if (running && now >= invulnUntil) {
    for (const a of asteroids) {
      const dx = ship.x - a.x, dy = ship.y - a.y;
      const rr = a.r + shipR * 0.7;
      if (dx * dx + dy * dy < rr * rr) {
        handleShipHit(now);
        break;
      }
    }
  }

  if (running && asteroids.length === 0) {
    endGame(true);
  }
}

function drawShip(now) {
  if (now < invulnUntil && Math.floor(now / 120) % 2 === 0) return;
  ctx.save();
  ctx.translate(ship.x, ship.y);
  ctx.rotate(ship.angle);
  ctx.beginPath();
  ctx.moveTo(0, -shipR);
  ctx.lineTo(-shipR * 0.7, shipR * 0.8);
  ctx.lineTo(0, shipR * 0.35);
  ctx.lineTo(shipR * 0.7, shipR * 0.8);
  ctx.closePath();
  ctx.fillStyle = '#6C5CE7';
  ctx.fill();
  if (thrusting()) {
    ctx.beginPath();
    ctx.moveTo(-shipR * 0.35, shipR * 0.75);
    ctx.lineTo(0, shipR * 1.4);
    ctx.lineTo(shipR * 0.35, shipR * 0.75);
    ctx.closePath();
    ctx.fillStyle = '#fdcb6e';
    ctx.fill();
  }
  ctx.restore();
}

function drawAsteroid(a) {
  ctx.save();
  ctx.translate(a.x, a.y);
  ctx.rotate(a.rot);
  ctx.beginPath();
  const n = a.verts.length;
  for (let i = 0; i < n; i++) {
    const angle = (i / n) * Math.PI * 2;
    const r = a.r * a.verts[i];
    const x = Math.cos(angle) * r;
    const y = Math.sin(angle) * r;
    if (i === 0) ctx.moveTo(x, y); else ctx.lineTo(x, y);
  }
  ctx.closePath();
  ctx.fillStyle = '#b2bec3';
  ctx.fill();
  ctx.strokeStyle = '#636e72';
  ctx.lineWidth = 2;
  ctx.stroke();
  ctx.restore();
}

function draw(now) {
  ctx.fillStyle = '#0b1026';
  ctx.fillRect(0, 0, W, H);

  ctx.fillStyle = '#ffffff';
  stars.forEach(s => {
    ctx.beginPath();
    ctx.arc(s.x, s.y, s.r, 0, Math.PI * 2);
    ctx.fill();
  });

  asteroids.forEach(drawAsteroid);

  ctx.fillStyle = '#fdcb6e';
  bullets.forEach(b => {
    ctx.beginPath();
    ctx.arc(b.x, b.y, 3, 0, Math.PI * 2);
    ctx.fill();
  });

  drawShip(now);
}

function loop(now) {
  if (!running) return;
  const dt = Math.min(0.032, (now - lastTime) / 1000);
  lastTime = now;
  update(dt, now);
  draw(now);
  rafId = requestAnimationFrame(loop);
}

function endGame(won) {
  running = false;
  cancelAnimationFrame(rafId);
  overEmojiEl.textContent = won ? '🎉' : '☄️';
  overTitleEl.textContent = won ? 'Du vann!' : 'Game over!';
  overScoreEl.textContent = String(score);
  overOverlay.classList.remove('hidden');
}

document.querySelectorAll('.diff').forEach(btn => {
  btn.addEventListener('click', () => {
    document.querySelectorAll('.diff').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    difficulty = btn.dataset.diff;
    resetGame();
  });
});

document.getElementById('restartBtn').addEventListener('click', resetGame);
document.getElementById('playAgainBtn').addEventListener('click', resetGame);

function bindHold(btn, flagObj, key) {
  const down = (e) => { e.preventDefault(); flagObj[key] = true; };
  const up = (e) => { e.preventDefault(); flagObj[key] = false; };
  btn.addEventListener('mousedown', down);
  btn.addEventListener('mouseup', up);
  btn.addEventListener('mouseleave', up);
  btn.addEventListener('touchstart', down, { passive: false });
  btn.addEventListener('touchend', up, { passive: false });
  btn.addEventListener('touchcancel', up, { passive: false });
}
bindHold(document.getElementById('rotLeftBtn'), touch, 'left');
bindHold(document.getElementById('rotRightBtn'), touch, 'right');
bindHold(document.getElementById('thrustBtn'), touch, 'thrust');
bindHold(document.getElementById('fireBtn'), touch, 'fire');

window.addEventListener('keydown', (e) => {
  if (e.key === 'ArrowLeft' || e.key === 'a' || e.key === 'A') { e.preventDefault(); keys.left = true; }
  if (e.key === 'ArrowRight' || e.key === 'd' || e.key === 'D') { e.preventDefault(); keys.right = true; }
  if (e.key === 'ArrowUp' || e.key === 'w' || e.key === 'W') { e.preventDefault(); keys.thrust = true; }
  if (e.key === ' ') { e.preventDefault(); keys.fire = true; }
});
window.addEventListener('keyup', (e) => {
  if (e.key === 'ArrowLeft' || e.key === 'a' || e.key === 'A') keys.left = false;
  if (e.key === 'ArrowRight' || e.key === 'd' || e.key === 'D') keys.right = false;
  if (e.key === 'ArrowUp' || e.key === 'w' || e.key === 'W') keys.thrust = false;
  if (e.key === ' ') keys.fire = false;
});

let resizeTimer = null;
new ResizeObserver(() => {
  clearTimeout(resizeTimer);
  resizeTimer = setTimeout(resetGame, 150);
}).observe(canvas.parentElement);

resetGame();
</script>

</body>
</html>
