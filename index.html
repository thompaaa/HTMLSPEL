<!DOCTYPE html>
<html lang="sv">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>HTMLSPEL 🎮</title>
<style>
  * { box-sizing: border-box; }
  html, body {
    height: 100%;
    margin: 0;
  }
  body {
    font-family: 'Trebuchet MS', 'Comic Sans MS', sans-serif;
    background: linear-gradient(135deg, #6C5CE7, #00CEC9);
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 24px;
  }
  h1 {
    color: white;
    text-shadow: 2px 2px 0 #333;
    margin: 0 0 24px;
    font-size: clamp(1.6rem, 5vw, 2.4rem);
    text-align: center;
  }
  .games {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(160px, 1fr));
    gap: 16px;
    max-width: 900px;
    width: 100%;
  }
  a.game-card {
    background: white;
    border-radius: 20px;
    padding: 24px 16px;
    box-shadow: 0 10px 30px rgba(0,0,0,0.3);
    text-decoration: none;
    color: #2d3436;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 8px;
    transition: transform 0.15s;
  }
  a.game-card:hover { transform: translateY(-4px) scale(1.03); }
  .game-card .icon { font-size: 3rem; }
  .game-card .name { font-weight: bold; font-size: 1.05rem; text-align: center; }
</style>
</head>
<body>

<h1>🎮 HTMLSPEL</h1>

<div class="games">
  <a class="game-card" href="ritverktyg/index.html">
    <span class="icon">🎨</span>
    <span class="name">Superritverktyget</span>
  </a>
  <a class="game-card" href="memory/index.html">
    <span class="icon">🧠</span>
    <span class="name">Memory</span>
  </a>
  <a class="game-card" href="ormen/index.html">
    <span class="icon">🐍</span>
    <span class="name">Ormen</span>
  </a>
  <a class="game-card" href="fargminne/index.html">
    <span class="icon">🎵</span>
    <span class="name">Färgminne</span>
  </a>
  <a class="game-card" href="mullvad/index.html">
    <span class="icon">🐹</span>
    <span class="name">Träffa mullvaden</span>
  </a>
  <a class="game-card" href="rakna/index.html">
    <span class="icon">➕</span>
    <span class="name">Räknelek</span>
  </a>
</div>

</body>
</html>
