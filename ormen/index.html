<!DOCTYPE html>
<html lang="sv">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Ormen 🐍</title>
<style>
  * { box-sizing: border-box; }
  html, body {
    height: 100%;
    margin: 0;
    overflow: hidden;
  }
  body {
    font-family: 'Trebuchet MS', 'Comic Sans MS', sans-serif;
    background: linear-gradient(135deg, #6C5CE7, #00CEC9);
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 8px;
  }
  h1 {
    color: #2d3436;
    margin: 0;
    font-size: clamp(14px, 2.4vh, 22px);
    white-space: nowrap;
  }
  #app {
    background: white;
    border-radius: 16px;
    padding: 8px;
    box-shadow: 0 10px 30px rgba(0,0,0,0.3);
    display: grid;
    grid-template-rows: auto 1fr auto;
    gap: 8px;
    width: 100%;
    height: 100%;
    max-width: 1100px;
  }
  .topbar, .bottombar {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 10px;
    flex-wrap: wrap;
    background: #f1f2f6;
    border-radius: 12px;
    padding: 8px 12px;
  }
  .diff-group {
    display: flex;
    gap: 4px;
    background: white;
    border-radius: 10px;
    padding: 3px;
  }
  button.diff {
    border: none;
    background: transparent;
    border-radius: 8px;
    padding: 6px 10px;
    font-weight: bold;
    font-size: clamp(11px, 1.6vh, 14px);
    cursor: pointer;
    color: #636e72;
  }
  button.diff.active { background: #6C5CE7; color: white; }
  .stats {
    font-weight: bold;
    color: #2d3436;
    font-size: clamp(12px, 1.8vh, 15px);
    white-space: nowrap;
  }
  button.action {
    border: none;
    border-radius: 8px;
    padding: 8px 14px;
    font-weight: bold;
    cursor: pointer;
    color: #2d3436;
    font-size: clamp(11px, 1.6vh, 14px);
    white-space: nowrap;
    background: #fdcb6e;
  }
  .board-wrap {
    flex: 1;
    min-height: 0;
    min-width: 0;
    display: flex;
    overflow: hidden;
  }
  canvas {
    background: #dfe4ea;
    border: 3px solid #2d3436;
    border-radius: 10px;
    display: block;
    width: 100%;
    height: 100%;
    touch-action: none;
  }
  .dpad {
    display: grid;
    grid-template-columns: repeat(3, clamp(34px, 8vw, 52px));
    grid-template-rows: repeat(2, clamp(34px, 8vw, 52px));
    grid-template-areas:
      ".    up    ."
      "left down  right";
    gap: 4px;
  }
  .dbtn {
    border: none;
    background: #dfe4ea;
    border-radius: 8px;
    font-size: clamp(16px, 3.5vw, 22px);
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .dbtn:active { background: #6C5CE7; color: white; }
  .dbtn[data-dir="up"] { grid-area: up; }
  .dbtn[data-dir="left"] { grid-area: left; }
  .dbtn[data-dir="down"] { grid-area: down; }
  .dbtn[data-dir="right"] { grid-area: right; }
  #overOverlay {
    position: fixed;
    inset: 0;
    background: rgba(45,52,54,0.55);
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 20px;
  }
  #overOverlay.hidden { display: none; }
  .over-card {
    background: white;
    border-radius: 20px;
    padding: 32px 28px;
    text-align: center;
    box-shadow: 0 10px 30px rgba(0,0,0,0.4);
    max-width: 360px;
  }
  .over-card .emoji { font-size: 3rem; margin-bottom: 8px; }
  .over-card p { color: #2d3436; font-size: 1.1rem; margin: 8px 0 20px; }
  .over-card button {
    background: #00b894;
    color: white;
    font-size: 1rem;
    padding: 10px 20px;
  }
</style>
</head>
<body>

<div id="app">
  <div class="topbar">
    <h1>🐍 Ormen</h1>
    <div class="diff-group">
      <button class="diff" data-diff="easy">Lätt</button>
      <button class="diff active" data-diff="medium">Mellan</button>
      <button class="diff" data-diff="hard">Svår</button>
    </div>
    <div class="stats">Poäng: <span id="score">0</span></div>
    <button id="restartBtn" class="action">🔄 Ny omgång</button>
  </div>

  <div class="board-wrap">
    <canvas id="canvas"></canvas>
  </div>

  <div class="bottombar">
    <div class="dpad">
      <button class="dbtn" data-dir="up" aria-label="Upp">⬆️</button>
      <button class="dbtn" data-dir="left" aria-label="Vänster">⬅️</button>
      <button class="dbtn" data-dir="down" aria-label="Ner">⬇️</button>
      <button class="dbtn" data-dir="right" aria-label="Höger">➡️</button>
    </div>
  </div>
</div>

<div id="overOverlay" class="hidden">
  <div class="over-card">
    <div class="emoji">🐍</div>
    <div><strong>Game over!</strong></div>
    <p>Du fick <span id="overScore"></span> poäng</p>
    <button id="playAgainBtn" class="action">Spela igen</button>
  </div>
</div>

<script>
const canvas = document.getElementById('canvas');
const ctx = canvas.getContext('2d');
const scoreEl = document.getElementById('score');
const overOverlay = document.getElementById('overOverlay');
const overScoreEl = document.getElementById('overScore');

const SPEEDS = { easy: 170, medium: 125, hard: 85 };
const TARGET_CELL = 26;

let difficulty = 'medium';
let cols = 20, rows = 14, cell = 26, offsetX = 0, offsetY = 0;
let snake, dir, nextDir, food, score, alive, timer;

function computeGrid() {
  const wrap = canvas.parentElement;
  const w = Math.max(1, Math.round(wrap.clientWidth));
  const h = Math.max(1, Math.round(wrap.clientHeight));
  canvas.width = w;
  canvas.height = h;

  let c = Math.max(10, Math.floor(w / TARGET_CELL));
  let r = Math.max(8, Math.floor(h / TARGET_CELL));
  const size = Math.max(6, Math.floor(Math.min(w / c, h / r)));

  cols = c;
  rows = r;
  cell = size;
  offsetX = Math.floor((w - cols * cell) / 2);
  offsetY = Math.floor((h - rows * cell) / 2);
}

function randCell() {
  return {
    x: Math.floor(Math.random() * cols),
    y: Math.floor(Math.random() * rows),
  };
}

function placeFood() {
  let pos;
  do {
    pos = randCell();
  } while (snake.some(s => s.x === pos.x && s.y === pos.y));
  food = pos;
}

function resetGame() {
  computeGrid();
  const cx = Math.floor(cols / 2), cy = Math.floor(rows / 2);
  snake = [{ x: cx - 1, y: cy }, { x: cx - 2, y: cy }, { x: cx - 3, y: cy }];
  dir = { x: 1, y: 0 };
  nextDir = { x: 1, y: 0 };
  score = 0;
  alive = true;
  scoreEl.textContent = '0';
  overOverlay.classList.add('hidden');
  placeFood();
  draw();
  clearInterval(timer);
  timer = setInterval(tick, SPEEDS[difficulty]);
}

function setDir(x, y) {
  if (dir.x === -x && dir.y === -y && snake.length > 1) return;
  nextDir = { x, y };
}

function tick() {
  if (!alive) return;
  dir = nextDir;
  const head = { x: snake[0].x + dir.x, y: snake[0].y + dir.y };

  if (head.x < 0 || head.x >= cols || head.y < 0 || head.y >= rows ||
      snake.some(s => s.x === head.x && s.y === head.y)) {
    alive = false;
    clearInterval(timer);
    overScoreEl.textContent = String(score);
    overOverlay.classList.remove('hidden');
    return;
  }

  snake.unshift(head);
  if (head.x === food.x && head.y === food.y) {
    score++;
    scoreEl.textContent = String(score);
    placeFood();
  } else {
    snake.pop();
  }
  draw();
}

function cellRect(cx, cy) {
  return [offsetX + cx * cell, offsetY + cy * cell, cell, cell];
}

function draw() {
  ctx.fillStyle = '#dfe4ea';
  ctx.fillRect(0, 0, canvas.width, canvas.height);

  for (let y = 0; y < rows; y++) {
    for (let x = 0; x < cols; x++) {
      ctx.fillStyle = (x + y) % 2 === 0 ? '#c8e6c9' : '#b2dfb5';
      ctx.fillRect(...cellRect(x, y));
    }
  }

  ctx.font = `${Math.floor(cell * 0.8)}px sans-serif`;
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  ctx.fillText('🍎', offsetX + food.x * cell + cell / 2, offsetY + food.y * cell + cell / 2 + 1);

  snake.forEach((s, i) => {
    const [rx, ry, rw, rh] = cellRect(s.x, s.y);
    const pad = cell * 0.08;
    ctx.fillStyle = i === 0 ? '#00997a' : '#00b894';
    ctx.beginPath();
    ctx.roundRect(rx + pad, ry + pad, rw - pad * 2, rh - pad * 2, cell * 0.25);
    ctx.fill();
  });
}

document.querySelectorAll('.diff').forEach(btn => {
  btn.addEventListener('click', () => {
    document.querySelectorAll('.diff').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    difficulty = btn.dataset.diff;
    resetGame();
  });
});

document.getElementById('restartBtn').addEventListener('click', resetGame);
document.getElementById('playAgainBtn').addEventListener('click', resetGame);

document.querySelectorAll('.dbtn').forEach(btn => {
  const dirMap = { up: [0, -1], down: [0, 1], left: [-1, 0], right: [1, 0] };
  btn.addEventListener('click', () => {
    const [x, y] = dirMap[btn.dataset.dir];
    setDir(x, y);
  });
});

window.addEventListener('keydown', (e) => {
  const map = {
    ArrowUp: [0, -1], w: [0, -1], W: [0, -1],
    ArrowDown: [0, 1], s: [0, 1], S: [0, 1],
    ArrowLeft: [-1, 0], a: [-1, 0], A: [-1, 0],
    ArrowRight: [1, 0], d: [1, 0], D: [1, 0],
  };
  if (map[e.key]) {
    e.preventDefault();
    setDir(map[e.key][0], map[e.key][1]);
  }
});

let touchStart = null;
canvas.addEventListener('touchstart', (e) => {
  const t = e.touches[0];
  touchStart = { x: t.clientX, y: t.clientY };
}, { passive: true });
canvas.addEventListener('touchend', (e) => {
  if (!touchStart) return;
  const t = e.changedTouches[0];
  const dx = t.clientX - touchStart.x;
  const dy = t.clientY - touchStart.y;
  if (Math.abs(dx) > Math.abs(dy)) {
    if (Math.abs(dx) > 20) setDir(dx > 0 ? 1 : -1, 0);
  } else {
    if (Math.abs(dy) > 20) setDir(0, dy > 0 ? 1 : -1);
  }
  touchStart = null;
});

let resizeTimer = null;
new ResizeObserver(() => {
  clearTimeout(resizeTimer);
  resizeTimer = setTimeout(resetGame, 150);
}).observe(canvas.parentElement);

resetGame();
</script>

</body>
</html>
