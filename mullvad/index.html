<!DOCTYPE html>
<html lang="sv">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Träffa mullvaden 🐹</title>
<style>
  * { box-sizing: border-box; }
  html, body {
    height: 100%;
    margin: 0;
    overflow: hidden;
  }
  body {
    font-family: 'Trebuchet MS', 'Comic Sans MS', sans-serif;
    background: linear-gradient(135deg, #6C5CE7, #00CEC9);
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 8px;
  }
  h1 {
    color: #2d3436;
    margin: 0;
    font-size: clamp(14px, 2.4vh, 22px);
    white-space: nowrap;
  }
  #app {
    background: white;
    border-radius: 16px;
    padding: 8px;
    box-shadow: 0 10px 30px rgba(0,0,0,0.3);
    display: grid;
    grid-template-rows: auto 1fr;
    gap: 8px;
    width: 100%;
    height: 100%;
    max-width: 1000px;
  }
  .topbar {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 10px;
    flex-wrap: wrap;
    background: #f1f2f6;
    border-radius: 12px;
    padding: 8px 12px;
  }
  .diff-group {
    display: flex;
    gap: 4px;
    background: white;
    border-radius: 10px;
    padding: 3px;
  }
  button.diff {
    border: none;
    background: transparent;
    border-radius: 8px;
    padding: 6px 10px;
    font-weight: bold;
    font-size: clamp(11px, 1.6vh, 14px);
    cursor: pointer;
    color: #636e72;
  }
  button.diff.active { background: #6C5CE7; color: white; }
  .stats {
    font-weight: bold;
    color: #2d3436;
    font-size: clamp(12px, 1.8vh, 15px);
    white-space: nowrap;
  }
  button.action {
    border: none;
    border-radius: 8px;
    padding: 8px 14px;
    font-weight: bold;
    cursor: pointer;
    color: white;
    font-size: clamp(11px, 1.6vh, 14px);
    white-space: nowrap;
    background: #00b894;
  }
  .board-wrap {
    flex: 1;
    min-height: 0;
    min-width: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    overflow: hidden;
    padding: 4px;
  }
  #board {
    width: 100%;
    height: 100%;
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    grid-template-rows: repeat(3, 1fr);
    gap: clamp(6px, 2vw, 18px);
  }
  .hole {
    position: relative;
    overflow: hidden;
    border-radius: 50%;
    background: radial-gradient(ellipse at center, #6b4a34 0%, #3e2c22 75%);
    box-shadow: inset 0 6px 10px rgba(0,0,0,0.5);
    cursor: pointer;
  }
  .mole {
    position: absolute;
    inset: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: min(12vw, 12vh);
    transform: translateY(100%);
    transition: transform 0.15s ease-out;
  }
  .mole::after {
    content: "🐹";
  }
  .hole.up .mole { transform: translateY(0%); }
  .hole.hit .mole::after { content: "💫"; }
  #overOverlay {
    position: fixed;
    inset: 0;
    background: rgba(45,52,54,0.55);
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 20px;
  }
  #overOverlay.hidden { display: none; }
  .over-card {
    background: white;
    border-radius: 20px;
    padding: 32px 28px;
    text-align: center;
    box-shadow: 0 10px 30px rgba(0,0,0,0.4);
    max-width: 360px;
  }
  .over-card .emoji { font-size: 3rem; margin-bottom: 8px; }
  .over-card p { color: #2d3436; font-size: 1.1rem; margin: 8px 0 20px; }
</style>
</head>
<body>

<div id="app">
  <div class="topbar">
    <h1>🐹 Träffa mullvaden</h1>
    <div class="diff-group">
      <button class="diff" data-diff="easy">Lätt</button>
      <button class="diff active" data-diff="medium">Mellan</button>
      <button class="diff" data-diff="hard">Svår</button>
    </div>
    <div class="stats">Poäng: <span id="score">0</span></div>
    <div class="stats">Tid: <span id="time">30</span> s</div>
    <button id="startBtn" class="action">▶️ Starta</button>
  </div>

  <div class="board-wrap">
    <div id="board"></div>
  </div>
</div>

<div id="overOverlay" class="hidden">
  <div class="over-card">
    <div class="emoji">🐹</div>
    <div><strong>Tiden är slut!</strong></div>
    <p>Du fick <span id="overScore"></span> poäng</p>
    <button id="playAgainBtn" class="action">Spela igen</button>
  </div>
</div>

<script>
const HOLE_COUNT = 9;
const ROUND_SECONDS = 30;
const DIFFICULTIES = {
  easy:   { spawnMin: 700,  spawnMax: 1100, visible: 1200 },
  medium: { spawnMin: 500,  spawnMax: 850,  visible: 900 },
  hard:   { spawnMin: 350,  spawnMax: 600,  visible: 650 },
};

const board = document.getElementById('board');
const scoreEl = document.getElementById('score');
const timeEl = document.getElementById('time');
const overOverlay = document.getElementById('overOverlay');
const overScoreEl = document.getElementById('overScore');

let difficulty = 'medium';
let holes = [];
let score = 0;
let timeLeft = ROUND_SECONDS;
let running = false;
let activeHole = null;
let moleTimeout = null;
let spawnTimeout = null;
let countdownTimer = null;

for (let i = 0; i < HOLE_COUNT; i++) {
  const hole = document.createElement('div');
  hole.className = 'hole';
  const mole = document.createElement('div');
  mole.className = 'mole';
  hole.appendChild(mole);
  hole.addEventListener('click', () => onHoleClick(hole));
  board.appendChild(hole);
  holes.push(hole);
}

function rand(min, max) {
  return Math.random() * (max - min) + min;
}

function showMole(hole) {
  activeHole = hole;
  hole.classList.remove('hit');
  hole.classList.add('up');
}

function hideMole(hole) {
  hole.classList.remove('up', 'hit');
  if (activeHole === hole) activeHole = null;
}

function scheduleSpawn() {
  const { spawnMin, spawnMax } = DIFFICULTIES[difficulty];
  spawnTimeout = setTimeout(spawnMole, rand(spawnMin, spawnMax));
}

function spawnMole() {
  if (!running) return;
  const hole = holes[Math.floor(Math.random() * holes.length)];
  showMole(hole);
  const { visible } = DIFFICULTIES[difficulty];
  moleTimeout = setTimeout(() => {
    hideMole(hole);
    if (running) scheduleSpawn();
  }, visible);
}

function onHoleClick(hole) {
  if (!running || !hole.classList.contains('up')) return;
  clearTimeout(moleTimeout);
  hole.classList.add('hit');
  score++;
  scoreEl.textContent = String(score);
  setTimeout(() => {
    hideMole(hole);
    if (running) scheduleSpawn();
  }, 150);
}

function tickCountdown() {
  timeLeft--;
  timeEl.textContent = String(timeLeft);
  if (timeLeft <= 0) endRound();
}

function endRound() {
  running = false;
  clearTimeout(moleTimeout);
  clearTimeout(spawnTimeout);
  clearInterval(countdownTimer);
  if (activeHole) hideMole(activeHole);
  overScoreEl.textContent = String(score);
  overOverlay.classList.remove('hidden');
}

function startGame() {
  running = true;
  score = 0;
  timeLeft = ROUND_SECONDS;
  scoreEl.textContent = '0';
  timeEl.textContent = String(timeLeft);
  overOverlay.classList.add('hidden');
  clearTimeout(moleTimeout);
  clearTimeout(spawnTimeout);
  clearInterval(countdownTimer);
  holes.forEach(hideMole);
  countdownTimer = setInterval(tickCountdown, 1000);
  scheduleSpawn();
}

document.querySelectorAll('.diff').forEach(btn => {
  btn.addEventListener('click', () => {
    document.querySelectorAll('.diff').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    difficulty = btn.dataset.diff;
  });
});

document.getElementById('startBtn').addEventListener('click', startGame);
document.getElementById('playAgainBtn').addEventListener('click', startGame);
</script>

</body>
</html>
