<!DOCTYPE html>
<html lang="sv">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Labyrint 🟡</title>
<style>
  * { box-sizing: border-box; }
  html, body {
    height: 100%;
    margin: 0;
    overflow: hidden;
  }
  body {
    font-family: 'Trebuchet MS', 'Comic Sans MS', sans-serif;
    background: linear-gradient(135deg, #6C5CE7, #00CEC9);
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 8px;
  }
  h1 {
    color: #2d3436;
    margin: 0;
    font-size: clamp(14px, 2.4vh, 22px);
    white-space: nowrap;
  }
  #app {
    background: white;
    border-radius: 16px;
    padding: 8px;
    box-shadow: 0 10px 30px rgba(0,0,0,0.3);
    display: grid;
    grid-template-rows: auto 1fr auto;
    gap: 8px;
    width: 100%;
    height: 100%;
    max-width: 1100px;
  }
  .topbar, .bottombar {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 10px;
    flex-wrap: wrap;
    background: #f1f2f6;
    border-radius: 12px;
    padding: 8px 12px;
  }
  .diff-group {
    display: flex;
    gap: 4px;
    background: white;
    border-radius: 10px;
    padding: 3px;
  }
  button.diff {
    border: none;
    background: transparent;
    border-radius: 8px;
    padding: 6px 10px;
    font-weight: bold;
    font-size: clamp(11px, 1.6vh, 14px);
    cursor: pointer;
    color: #636e72;
  }
  button.diff.active { background: #6C5CE7; color: white; }
  .stats {
    font-weight: bold;
    color: #2d3436;
    font-size: clamp(12px, 1.8vh, 15px);
    white-space: nowrap;
  }
  button.action {
    border: none;
    border-radius: 8px;
    padding: 8px 14px;
    font-weight: bold;
    cursor: pointer;
    color: #2d3436;
    font-size: clamp(11px, 1.6vh, 14px);
    white-space: nowrap;
    background: #fdcb6e;
  }
  .board-wrap {
    flex: 1;
    min-height: 0;
    min-width: 0;
    display: flex;
    overflow: hidden;
  }
  canvas {
    background: #0b0e2b;
    border: 3px solid #2d3436;
    border-radius: 10px;
    display: block;
    width: 100%;
    height: 100%;
    touch-action: none;
  }
  .dpad {
    display: grid;
    grid-template-columns: repeat(3, clamp(48px, 12vw, 76px));
    grid-template-rows: repeat(2, clamp(48px, 12vw, 76px));
    grid-template-areas:
      ".    up    ."
      "left down  right";
    gap: 6px;
  }
  .dbtn {
    border: none;
    background: #dfe4ea;
    border-radius: 10px;
    font-size: clamp(22px, 5vw, 32px);
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .dbtn:active { background: #6C5CE7; color: white; }
  .dbtn[data-dir="up"] { grid-area: up; }
  .dbtn[data-dir="left"] { grid-area: left; }
  .dbtn[data-dir="down"] { grid-area: down; }
  .dbtn[data-dir="right"] { grid-area: right; }
  #overOverlay {
    position: fixed;
    inset: 0;
    background: rgba(45,52,54,0.55);
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 20px;
  }
  #overOverlay.hidden { display: none; }
  .over-card {
    background: white;
    border-radius: 20px;
    padding: 32px 28px;
    text-align: center;
    box-shadow: 0 10px 30px rgba(0,0,0,0.4);
    max-width: 360px;
  }
  .over-card .emoji { font-size: 3rem; margin-bottom: 8px; }
  .over-card p { color: #2d3436; font-size: 1.1rem; margin: 8px 0 20px; }
  .over-card button {
    background: #00b894;
    color: white;
    font-size: 1rem;
    padding: 10px 20px;
  }
</style>
</head>
<body>

<div id="app">
  <div class="topbar">
    <h1>🟡 Labyrint</h1>
    <div class="diff-group">
      <button class="diff" data-diff="easy">Lätt</button>
      <button class="diff active" data-diff="medium">Mellan</button>
      <button class="diff" data-diff="hard">Svår</button>
    </div>
    <div class="stats">Poäng: <span id="score">0</span></div>
    <div class="stats">Liv: <span id="lives">3</span></div>
    <button id="restartBtn" class="action">🔄 Ny omgång</button>
  </div>

  <div class="board-wrap">
    <canvas id="canvas"></canvas>
  </div>

  <div class="bottombar">
    <div class="dpad">
      <button class="dbtn" data-dir="up" aria-label="Upp">⬆️</button>
      <button class="dbtn" data-dir="left" aria-label="Vänster">⬅️</button>
      <button class="dbtn" data-dir="down" aria-label="Ner">⬇️</button>
      <button class="dbtn" data-dir="right" aria-label="Höger">➡️</button>
    </div>
  </div>
</div>

<div id="overOverlay" class="hidden">
  <div class="over-card">
    <div class="emoji" id="overEmoji">🟡</div>
    <div><strong id="overTitle">Game over!</strong></div>
    <p>Du fick <span id="overScore"></span> poäng</p>
    <button id="playAgainBtn" class="action">Spela igen</button>
  </div>
</div>

<script>
const canvas = document.getElementById('canvas');
const ctx = canvas.getContext('2d');
const scoreEl = document.getElementById('score');
const livesEl = document.getElementById('lives');
const overOverlay = document.getElementById('overOverlay');
const overScoreEl = document.getElementById('overScore');
const overTitleEl = document.getElementById('overTitle');
const overEmojiEl = document.getElementById('overEmoji');

const MAZE_TEMPLATE = [
  "###############",
  "#P............#",
  "#.##.......##.#",
  "#.##.......##.#",
  "#......#......#",
  "#......#......#",
  "#.....G.G.....#",
  "#......#......#",
  "#......#......#",
  "#.##.......##.#",
  "#.##.......##.#",
  "#.............#",
  "###############",
];
const COLS = MAZE_TEMPLATE[0].length;
const ROWS = MAZE_TEMPLATE.length;

let PLAYER_START = { x: 1, y: 1 };
const GHOST_SPAWNS = [];
for (let y = 0; y < ROWS; y++) {
  for (let x = 0; x < COLS; x++) {
    const ch = MAZE_TEMPLATE[y][x];
    if (ch === 'P') PLAYER_START = { x, y };
    if (ch === 'G') GHOST_SPAWNS.push({ x, y });
  }
}

const DIRS = [{ x: 0, y: -1 }, { x: 0, y: 1 }, { x: -1, y: 0 }, { x: 1, y: 0 }];
const DIFF = {
  easy:   { ghostMs: 480, random: 0.4 },
  medium: { ghostMs: 340, random: 0.15 },
  hard:   { ghostMs: 220, random: 0 },
};
const GHOST_COLORS = ['#e84118', '#00cec9'];
const PLAYER_MOVE_MS = 150;
const CANVAS_BG = '#0b0e2b';
const WALL_COLOR = '#3742fa';
const DOT_COLOR = '#fdcb6e';
const PLAYER_COLOR = '#ffd32a';

let difficulty = 'medium';
let cell = 20, offsetX = 0, offsetY = 0;
let grid, dotsRemaining, score, lives, running;
let player, ghosts;
let playerTimer = null, ghostTimer = null;

function computeLayout() {
  const wrap = canvas.parentElement;
  const w = Math.max(1, Math.round(wrap.clientWidth));
  const h = Math.max(1, Math.round(wrap.clientHeight));
  canvas.width = w;
  canvas.height = h;
  cell = Math.max(4, Math.floor(Math.min(w / COLS, h / ROWS)));
  offsetX = Math.floor((w - COLS * cell) / 2);
  offsetY = Math.floor((h - ROWS * cell) / 2);
}

function buildGrid() {
  grid = MAZE_TEMPLATE.map(row => row.split('').map(ch => {
    if (ch === '#') return 0;
    if (ch === 'P' || ch === 'G') return 2;
    return 1;
  }));
}

function isWall(x, y) {
  if (x < 0 || x >= COLS || y < 0 || y >= ROWS) return true;
  return grid[y][x] === 0;
}

function resetGame() {
  computeLayout();
  buildGrid();
  dotsRemaining = 0;
  for (let y = 0; y < ROWS; y++) for (let x = 0; x < COLS; x++) if (grid[y][x] === 1) dotsRemaining++;

  score = 0;
  lives = 3;
  scoreEl.textContent = '0';
  livesEl.textContent = '3';
  overOverlay.classList.add('hidden');

  player = { x: PLAYER_START.x, y: PLAYER_START.y, dir: { x: 0, y: 0 }, nextDir: { x: 0, y: 0 } };
  ghosts = GHOST_SPAWNS.map((p, i) => ({
    x: p.x, y: p.y,
    dir: i % 2 === 0 ? { x: -1, y: 0 } : { x: 1, y: 0 },
    color: GHOST_COLORS[i % GHOST_COLORS.length],
  }));

  running = true;
  clearInterval(playerTimer);
  clearInterval(ghostTimer);
  playerTimer = setInterval(playerTick, PLAYER_MOVE_MS);
  ghostTimer = setInterval(ghostTick, DIFF[difficulty].ghostMs);
  draw();
}

function setDir(x, y) {
  player.nextDir = { x, y };
}

function eatDot() {
  if (grid[player.y][player.x] === 1) {
    grid[player.y][player.x] = 2;
    score++;
    scoreEl.textContent = String(score);
    dotsRemaining--;
    if (dotsRemaining <= 0) winGame();
  }
}

function checkCollision() {
  if (!running) return;
  if (ghosts.some(g => g.x === player.x && g.y === player.y)) loseLife();
}

function playerTick() {
  if (!running) return;
  if (player.nextDir.x || player.nextDir.y) {
    const nx = player.x + player.nextDir.x, ny = player.y + player.nextDir.y;
    if (!isWall(nx, ny)) player.dir = player.nextDir;
  }
  if (player.dir.x || player.dir.y) {
    const nx = player.x + player.dir.x, ny = player.y + player.dir.y;
    if (!isWall(nx, ny)) {
      player.x = nx;
      player.y = ny;
    } else {
      player.dir = { x: 0, y: 0 };
    }
  }
  eatDot();
  checkCollision();
  draw();
}

function ghostTick() {
  if (!running) return;
  const cfg = DIFF[difficulty];
  ghosts.forEach(g => {
    const valid = DIRS.filter(d => !isWall(g.x + d.x, g.y + d.y));
    if (valid.length === 0) return;
    const reverse = { x: -g.dir.x, y: -g.dir.y };
    const nonReverse = valid.filter(d => !(d.x === reverse.x && d.y === reverse.y));
    const candidates = nonReverse.length > 0 ? nonReverse : valid;
    let choice;
    if (Math.random() < cfg.random) {
      choice = candidates[Math.floor(Math.random() * candidates.length)];
    } else {
      let best = null, bestDist = Infinity;
      candidates.forEach(d => {
        const nx = g.x + d.x, ny = g.y + d.y;
        const dist = Math.abs(nx - player.x) + Math.abs(ny - player.y);
        if (dist < bestDist) { bestDist = dist; best = d; }
      });
      choice = best;
    }
    g.dir = choice;
    g.x += choice.x;
    g.y += choice.y;
  });
  checkCollision();
  draw();
}

function loseLife() {
  running = false;
  clearInterval(playerTimer);
  clearInterval(ghostTimer);
  lives--;
  livesEl.textContent = String(lives);
  if (lives <= 0) {
    gameOver();
    return;
  }
  setTimeout(() => {
    player.x = PLAYER_START.x;
    player.y = PLAYER_START.y;
    player.dir = { x: 0, y: 0 };
    player.nextDir = { x: 0, y: 0 };
    ghosts.forEach((g, i) => {
      g.x = GHOST_SPAWNS[i].x;
      g.y = GHOST_SPAWNS[i].y;
      g.dir = i % 2 === 0 ? { x: -1, y: 0 } : { x: 1, y: 0 };
    });
    running = true;
    draw();
    playerTimer = setInterval(playerTick, PLAYER_MOVE_MS);
    ghostTimer = setInterval(ghostTick, DIFF[difficulty].ghostMs);
  }, 700);
}

function gameOver() {
  overEmojiEl.textContent = '💀';
  overTitleEl.textContent = 'Game over!';
  overScoreEl.textContent = String(score);
  overOverlay.classList.remove('hidden');
}

function winGame() {
  running = false;
  clearInterval(playerTimer);
  clearInterval(ghostTimer);
  overEmojiEl.textContent = '🎉';
  overTitleEl.textContent = 'Du vann!';
  overScoreEl.textContent = String(score);
  overOverlay.classList.remove('hidden');
}

function cellCenter(x, y) {
  return [offsetX + x * cell + cell / 2, offsetY + y * cell + cell / 2];
}

function draw() {
  ctx.fillStyle = CANVAS_BG;
  ctx.fillRect(0, 0, canvas.width, canvas.height);

  for (let y = 0; y < ROWS; y++) {
    for (let x = 0; x < COLS; x++) {
      if (grid[y][x] === 0) {
        ctx.fillStyle = WALL_COLOR;
        ctx.beginPath();
        ctx.roundRect(offsetX + x * cell + 1, offsetY + y * cell + 1, cell - 2, cell - 2, cell * 0.2);
        ctx.fill();
      } else if (grid[y][x] === 1) {
        const [cx, cy] = cellCenter(x, y);
        ctx.fillStyle = DOT_COLOR;
        ctx.beginPath();
        ctx.arc(cx, cy, Math.max(1.5, cell * 0.1), 0, Math.PI * 2);
        ctx.fill();
      }
    }
  }

  ghosts.forEach(g => {
    const [cx, cy] = cellCenter(g.x, g.y);
    const r = cell * 0.4;
    ctx.fillStyle = g.color;
    ctx.beginPath();
    ctx.arc(cx, cy - r * 0.15, r, Math.PI, 0, false);
    ctx.lineTo(cx + r, cy + r * 0.7);
    for (let i = 0; i < 4; i++) {
      const bx = cx + r - (i + 0.5) * (r * 2 / 4);
      ctx.quadraticCurveTo(bx + r / 4, cy + r * 1.1, bx, cy + r * 0.7);
    }
    ctx.lineTo(cx - r, cy - r * 0.15);
    ctx.closePath();
    ctx.fill();

    ctx.fillStyle = 'white';
    ctx.beginPath();
    ctx.arc(cx - r * 0.35, cy - r * 0.1, r * 0.28, 0, Math.PI * 2);
    ctx.arc(cx + r * 0.35, cy - r * 0.1, r * 0.28, 0, Math.PI * 2);
    ctx.fill();
    ctx.fillStyle = '#2d3436';
    ctx.beginPath();
    ctx.arc(cx - r * 0.35 + g.dir.x * r * 0.12, cy - r * 0.1 + g.dir.y * r * 0.12, r * 0.13, 0, Math.PI * 2);
    ctx.arc(cx + r * 0.35 + g.dir.x * r * 0.12, cy - r * 0.1 + g.dir.y * r * 0.12, r * 0.13, 0, Math.PI * 2);
    ctx.fill();
  });

  const [px, py] = cellCenter(player.x, player.y);
  const pr = cell * 0.42;
  let angle = 0;
  if (player.dir.x === 1) angle = 0;
  else if (player.dir.x === -1) angle = Math.PI;
  else if (player.dir.y === -1) angle = -Math.PI / 2;
  else if (player.dir.y === 1) angle = Math.PI / 2;
  const chomp = Math.floor(Date.now() / 150) % 2 === 0 ? 0.22 : 0.05;
  ctx.fillStyle = PLAYER_COLOR;
  ctx.beginPath();
  ctx.moveTo(px, py);
  ctx.arc(px, py, pr, angle + chomp * Math.PI, angle + (2 - chomp) * Math.PI);
  ctx.closePath();
  ctx.fill();
}

document.querySelectorAll('.diff').forEach(btn => {
  btn.addEventListener('click', () => {
    document.querySelectorAll('.diff').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    difficulty = btn.dataset.diff;
    resetGame();
  });
});

document.getElementById('restartBtn').addEventListener('click', resetGame);
document.getElementById('playAgainBtn').addEventListener('click', resetGame);

document.querySelectorAll('.dbtn').forEach(btn => {
  const dirMap = { up: [0, -1], down: [0, 1], left: [-1, 0], right: [1, 0] };
  btn.addEventListener('click', () => {
    const [x, y] = dirMap[btn.dataset.dir];
    setDir(x, y);
  });
});

window.addEventListener('keydown', (e) => {
  const map = {
    ArrowUp: [0, -1], w: [0, -1], W: [0, -1],
    ArrowDown: [0, 1], s: [0, 1], S: [0, 1],
    ArrowLeft: [-1, 0], a: [-1, 0], A: [-1, 0],
    ArrowRight: [1, 0], d: [1, 0], D: [1, 0],
  };
  if (map[e.key]) {
    e.preventDefault();
    setDir(map[e.key][0], map[e.key][1]);
  }
});

let touchStart = null;
canvas.addEventListener('touchstart', (e) => {
  const t = e.touches[0];
  touchStart = { x: t.clientX, y: t.clientY };
}, { passive: true });
canvas.addEventListener('touchend', (e) => {
  if (!touchStart) return;
  const t = e.changedTouches[0];
  const dx = t.clientX - touchStart.x;
  const dy = t.clientY - touchStart.y;
  if (Math.abs(dx) > Math.abs(dy)) {
    if (Math.abs(dx) > 20) setDir(dx > 0 ? 1 : -1, 0);
  } else {
    if (Math.abs(dy) > 20) setDir(0, dy > 0 ? 1 : -1);
  }
  touchStart = null;
});

let resizeTimer = null;
new ResizeObserver(() => {
  clearTimeout(resizeTimer);
  resizeTimer = setTimeout(resetGame, 150);
}).observe(canvas.parentElement);

resetGame();
</script>

</body>
</html>
